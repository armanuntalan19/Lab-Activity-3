<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reef Math - Grade 1 Mathematics</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Baloo 2"', 'Trebuchet MS', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(#8ff0f5, #1a8fbf 50%, #0b3d5c) fixed;
      color: #0b3d5c;
    }

    .chunky {
      box-shadow: 0 6px 0 rgba(11, 61, 92, 0.25);
      transition: transform 0.1s;
    }

    .chunky:hover {
      transform: translateY(-3px);
    }

    .chunky:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(11, 61, 92, 0.25);
    }

    .swim {
      display: inline-block;
      animation: swim 3s ease-in-out infinite;
    }

    @keyframes swim {
      0%, 100% { transform: translate(0, 0) rotate(-5deg); }
      50% { transform: translate(10px, -10px) rotate(5deg); }
    }

    .bubble {
      position: fixed;
      bottom: -60px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.2);
      animation: rise linear infinite;
      pointer-events: none;
    }

    @keyframes rise {
      to { transform: translateY(-115vh); }
    }

    .floor {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 70px;
      background: #ffe7ad;
      border-radius: 50% 50% 0 0 / 40px 40px 0 0;
      text-align: center;
      font-size: 2.2rem;
      line-height: 50px;
      letter-spacing: 22px;
      pointer-events: none;
    }
  </style>
</head>

<body class="h-full flex flex-col font-sans antialiased">

  <div class="bubble" style="left: 10%; width: 30px; height: 30px; animation-duration: 12s;"></div>
  <div class="bubble" style="left: 40%; width: 18px; height: 18px; animation-duration: 9s; animation-delay: 3s;"></div>
  <div class="bubble" style="left: 70%; width: 40px; height: 40px; animation-duration: 15s; animation-delay: 1s;"></div>
  <div class="bubble" style="left: 90%; width: 24px; height: 24px; animation-duration: 10s; animation-delay: 5s;"></div>

  <header class="max-w-4xl w-full mx-auto px-4 pt-5 flex items-center justify-between">
    <div class="text-3xl font-extrabold text-white cursor-pointer drop-shadow" onclick="app.showDashboard()">🫧 Reef Math</div>
    <div class="bg-amber-100 text-sky-900 font-extrabold text-lg px-5 py-1 rounded-full chunky">
      🐚 <span id="global-shells">0</span>
    </div>
  </header>

  <main id="app-container" class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 pb-32"></main>

  <div class="floor">🌿🐚🪸🌿🦀🪸🌿</div>

  <div id="reward-modal" class="fixed inset-0 bg-sky-950/50 z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-[2.5rem] p-8 max-w-sm w-full mx-4 text-center chunky">
      <div id="reward-icon" class="text-7xl mb-3 swim"></div>
      <h3 id="reward-title" class="text-3xl font-extrabold mb-2"></h3>
      <p id="reward-desc" class="text-lg mb-5"></p>
      <button onclick="app.closeRewardModal()" class="w-full py-3 bg-orange-400 text-white font-extrabold text-xl rounded-full chunky">
        Back to the reef
      </button>
    </div>
  </div>

  <div id="fx-container" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <script>
    const buddies = ['🐠', '🐙', '🐢', '🦀', '🐬'];

    const mathTopics = [
      {
        id: 'counting',
        title: 'Count & Compare',
        icon: '🐠',
        color: '#2eb5e0',
        description: 'Count fish, stars and kitties. Then find the bigger number!',
        questions: [
          { type: 'count', target: 5, emoji: '🍎', prompt: 'How many juicy apples do you see?' },
          { type: 'count', target: 8, emoji: '⭐', prompt: 'Count the glowing stars in the sky!' },
          { type: 'count', target: 4, emoji: '🐱', prompt: 'How many playful kitties are here?' },
          { type: 'choice', q: 'Which number is bigger: 7 or 4?', options: ['7', '4'], answer: 0 },
          { type: 'choice', q: 'What number comes next? 1, 2, 3, ?', options: ['4', '5', '0'], answer: 0 }
        ]
      },
      {
        id: 'addition',
        title: 'Addition: Put Together',
        icon: '🐙',
        color: '#ff8fab',
        description: 'Put two groups together. How many are there in all?',
        questions: [
          { type: 'math', a: 2, b: 3, op: '+', emoji: '🍓' },
          { type: 'math', a: 4, b: 1, op: '+', emoji: '🐥' },
          { type: 'math', a: 3, b: 3, op: '+', emoji: '🎈' },
          { type: 'math', a: 5, b: 2, op: '+', emoji: '🌼' },
          { type: 'math', a: 1, b: 6, op: '+', emoji: '🚗' }
        ]
      },
      {
        id: 'subtraction',
        title: 'Subtraction: Take Away',
        icon: '🐢',
        color: '#3cc78f',
        description: 'Take some away. How many are left over?',
        questions: [
          { type: 'math', a: 5, b: 2, op: '-', emoji: '🍪' },
          { type: 'math', a: 4, b: 1, op: '-', emoji: '🐟' },
          { type: 'math', a: 6, b: 3, op: '-', emoji: '🍩' },
          { type: 'math', a: 7, b: 4, op: '-', emoji: '🦋' },
          { type: 'math', a: 3, b: 0, op: '-', emoji: '🍌' }
        ]
      },
      {
        id: 'shapes',
        title: 'Shapes & Patterns',
        icon: '🔷',
        color: '#ffb547',
        description: 'Find the shapes and finish the fun patterns!',
        questions: [
          { type: 'choice', q: 'Which shape has 3 equal sides and 3 corners?', options: ['Triangle 🔺', 'Square 🟦', 'Circle 🔵'], answer: 0 },
          { type: 'choice', q: 'What shape looks like a wheel or a ball?', options: ['Rectangle ▭', 'Circle 🔵', 'Square 🟦'], answer: 1 },
          { type: 'choice', q: 'Finish the pattern: 🔴 🔵 🔴 🔵 ?', options: ['🔴', '🔵', '🟢'], answer: 0 },
          { type: 'choice', q: 'How many corners does a square have?', options: ['3', '4', '5'], answer: 1 },
          { type: 'choice', q: 'Which shape has 4 equal straight sides?', options: ['Triangle 🔺', 'Square 🟦', 'Star ⭐'], answer: 1 }
        ]
      }
    ];

    function makeOptions(answer) {
      let smaller = answer - 1;
      if (smaller < 0) smaller = answer + 2;
      let options = [answer, answer + 1, smaller];
      options.sort(function () { return Math.random() - 0.5; });
      return options;
    }

    class MathApp {
      constructor() {
        this.loadState();
        this.currentView = 'dashboard';
        this.activeTopicId = null;
        this.currentQuestionIndex = 0;
        this.score = 0;
        this.init();
      }

      loadState() {
        this.name = localStorage.getItem('reef_name') || '';
        this.buddy = localStorage.getItem('reef_buddy') || buddies[0];
        try {
          this.progress = JSON.parse(localStorage.getItem('reef_progress')) || {};
        } catch (e) {
          this.progress = {};
        }
      }

      saveState() {
        localStorage.setItem('reef_progress', JSON.stringify(this.progress));
        this.updateHeader();
      }

      saveName() {
        const input = document.getElementById('name-input');
        if (input) this.name = input.value.trim();
        localStorage.setItem('reef_name', this.name);
      }

      chooseBuddy(buddy) {
        this.saveName();
        this.buddy = buddy;
        localStorage.setItem('reef_buddy', buddy);
        this.render();
      }

      getName() {
        return this.name || 'friend';
      }

      getTopic() {
        for (let topic of mathTopics) {
          if (topic.id === this.activeTopicId) return topic;
        }
      }

      getTotalShells() {
        let total = 0;
        for (let topicId in this.progress) {
          total += this.progress[topicId].shells || 0;
        }
        return total;
      }

      updateHeader() {
        document.getElementById('global-shells').innerText = this.getTotalShells();
      }

      init() {
        this.updateHeader();
        this.render();
      }

      showDashboard() {
        this.currentView = 'dashboard';
        this.activeTopicId = null;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      startTopic(topicId) {
        this.saveName();
        this.currentView = 'game';
        this.activeTopicId = topicId;
        this.currentQuestionIndex = 0;
        this.score = 0;
        this.render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      speak(text) {
        speechSynthesis.speak(new SpeechSynthesisUtterance(text));
      }

      answerQuestion(button, selectedIndex, correctIndex) {
        const topic = this.getTopic();
        const feedbackEl = document.getElementById('question-feedback');

        const buttons = document.querySelectorAll('.option-btn');
        for (let b of buttons) b.disabled = true;

        if (selectedIndex === correctIndex) {
          this.score += 1;
          button.classList.add('!bg-emerald-500', 'text-white');
          feedbackEl.innerText = `🎉 Yes, ${this.getName()}! You found a shell!`;
          this.triggerConfetti();
        } else {
          button.classList.add('!bg-orange-400', 'text-white');
          feedbackEl.innerText = `💙 Good try, ${this.getName()}! Keep swimming!`;
        }

        setTimeout(() => {
          this.currentQuestionIndex++;
          if (this.currentQuestionIndex < topic.questions.length) {
            this.render();
          } else {
            this.finishTopicGame();
          }
        }, 1500);
      }

      finishTopicGame() {
        const topicId = this.activeTopicId;
        if (!this.progress[topicId]) {
          this.progress[topicId] = { shells: 0 };
        }
        this.progress[topicId].shells = Math.max(this.progress[topicId].shells, this.score);
        this.saveState();

        document.getElementById('reward-icon').innerText = this.buddy;
        document.getElementById('reward-title').innerText = `Great job, ${this.getName()}!`;
        document.getElementById('reward-desc').innerText = `You found ${this.score} out of 5 shells! ${'🐚'.repeat(this.score)}`;

        const modal = document.getElementById('reward-modal');
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
      }

      closeRewardModal() {
        const modal = document.getElementById('reward-modal');
        modal.classList.add('opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
          this.showDashboard();
        }, 300);
      }

      triggerConfetti() {
        const fx = document.getElementById('fx-container');
        const shell = document.createElement('div');
        shell.innerText = '🐚';
        shell.className = 'absolute text-5xl swim';
        shell.style.left = `${Math.random() * 80 + 10}%`;
        shell.style.top = `${Math.random() * 50 + 30}%`;
        fx.appendChild(shell);
        setTimeout(() => shell.remove(), 1200);
      }

      render() {
        const container = document.getElementById('app-container');
        if (this.currentView === 'dashboard') {
          container.innerHTML = this.getDashboardHTML();
        } else {
          container.innerHTML = this.getGameHTML();
        }
      }

      getDashboardHTML() {
        let buddyButtons = '';
        for (let b of buddies) {
          let style = 'bg-sky-50';
          if (b === this.buddy) style = 'bg-amber-200 ring-4 ring-orange-400';
          buddyButtons += `<button onclick="app.chooseBuddy('${b}')" class="w-16 h-16 text-4xl rounded-full chunky ${style}">${b}</button>`;
        }

        let topicCards = '';
        for (let topic of mathTopics) {
          let shells = 0;
          if (this.progress[topic.id]) shells = this.progress[topic.id].shells;
          topicCards += `
            <button onclick="app.startTopic('${topic.id}')" class="chunky rounded-[2rem] p-6 text-white text-center" style="background: ${topic.color}">
              <div class="text-6xl mb-2">${topic.icon}</div>
              <h3 class="text-2xl font-extrabold leading-tight">${topic.title}</h3>
              <p class="text-base mt-2 mb-3 opacity-95">${topic.description}</p>
              <div class="text-2xl min-h-[2rem]">${'🐚'.repeat(shells)}</div>
            </button>`;
        }

        return `
          <div class="bg-white rounded-[2.5rem] p-6 sm:p-8 text-center chunky mb-8">
            <div class="text-7xl swim">${this.buddy}</div>
            <h1 class="text-3xl sm:text-4xl font-extrabold mt-2">Hi ${this.getName()}! Let's dive into math!</h1>
            <p class="text-lg mt-1 mb-4">Type your name and pick your sea buddy.</p>
            <input id="name-input" value="${this.name}" maxlength="12" placeholder="Type your name" onchange="app.saveName(); app.render()"
              class="text-center text-2xl font-bold px-4 py-2 rounded-2xl border-4 border-teal-300 w-64 mb-5">
            <div class="flex justify-center gap-3 flex-wrap">${buddyButtons}</div>
          </div>

          <h2 class="text-3xl font-extrabold text-white text-center mb-5 drop-shadow">Pick a game!</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">${topicCards}</div>`;
      }

      getGameHTML() {
        const topic = this.getTopic();
        const q = topic.questions[this.currentQuestionIndex];
        const totalQ = topic.questions.length;
        const progressPercent = Math.round((this.currentQuestionIndex / totalQ) * 100);

        let title = '';
        let visual = '';
        let options = [];
        let correctIdx = 0;

        if (q.type === 'count') {
          title = q.prompt;
          visual = q.emoji.repeat(q.target);
          options = makeOptions(q.target);
          correctIdx = options.indexOf(q.target);
        } else if (q.type === 'math') {
          let answer = q.a - q.b;
          if (q.op === '+') answer = q.a + q.b;
          title = `${q.a} ${q.op} ${q.b} = ?`;
          let second = q.emoji.repeat(q.b);
          if (q.b === 0) second = '0';
          visual = `${q.emoji.repeat(q.a)} <span class="mx-2 font-bold">${q.op}</span> ${second}`;
          options = makeOptions(answer);
          correctIdx = options.indexOf(answer);
        } else {
          title = q.q;
          options = q.options;
          correctIdx = q.answer;
        }

        let optionButtons = '';
        for (let idx = 0; idx < options.length; idx++) {
          let opt = options[idx];
          optionButtons += `
          <button onclick="app.answerQuestion(this, ${idx}, ${correctIdx})" class="option-btn chunky py-4 px-4 bg-sky-50 border-4 border-teal-300 font-extrabold text-3xl rounded-full">
            ${opt}
          </button>`;
        }

        let visualBox = '';
        if (visual) {
          visualBox = `<div class="bg-cyan-50 border-4 border-dashed border-teal-300 rounded-[2rem] p-5 mb-5 text-4xl leading-relaxed">${visual}</div>`;
        }

        return `
          <div class="flex items-center justify-between mb-4 text-white font-extrabold">
            <button onclick="app.showDashboard()" class="chunky bg-white text-sky-900 px-5 py-2 rounded-full">⬅ Home</button>
            <span>${topic.icon} ${topic.title} · ${this.currentQuestionIndex + 1} of ${totalQ}</span>
          </div>

          <div class="relative h-6 bg-white/40 rounded-full mb-8">
            <div class="h-full bg-amber-100 rounded-full transition-all duration-500" style="width: ${progressPercent + 4}%"></div>
            <span class="absolute text-3xl -top-2 transition-all duration-500" style="left: ${progressPercent + 4}%; transform: translateX(-50%)">${this.buddy}</span>
          </div>

          <div class="bg-white rounded-[2.5rem] p-6 sm:p-10 max-w-2xl mx-auto text-center chunky">
            <div class="text-6xl swim">${this.buddy}</div>
            <div class="text-3xl font-extrabold mt-2 mb-3">${title}</div>
            <button onclick="app.speak(this.dataset.text)" data-text="${title.replace(/"/g, '')}" class="chunky mb-4 px-5 py-1 rounded-full bg-amber-200 font-bold">🔊 Listen</button>
            ${visualBox}
            <div id="question-feedback" class="text-xl font-extrabold min-h-[2rem] mb-5"></div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">${optionButtons}</div>
          </div>`;
      }
    }

    const app = new MathApp();
  </script>
</body>
</html>
